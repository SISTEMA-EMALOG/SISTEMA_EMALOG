<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>{% block title %}EMALOG - Sistema de Gestão Logística{% endblock %}</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo-emalog-icon.jpg') }}">

    <!-- Preconnect para CDNs -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" crossorigin="anonymous">

    <!-- TailwindCSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        'primary-dark': '#1e3a8a',
                        'primary-light': '#3b82f6'
                    }
                }
            }
        }
    </script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    {% block head %}{% endblock %}
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body class="h-full">
    <div class="min-h-full">
        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="fixed top-4 right-4 z-50 space-y-2" aria-live="polite" aria-atomic="true">
                    {% for category, message in messages %}
                        <div class="flash-message alert bg-{{ 'red' if category == 'error' else ('green' if category == 'success' else ('yellow' if category == 'warning' else 'blue')) }}-50 border border-{{ 'red' if category == 'error' else ('green' if category == 'success' else ('yellow' if category == 'warning' else 'blue')) }}-200 text-{{ 'red' if category == 'error' else ('green' if category == 'success' else ('yellow' if category == 'warning' else 'blue')) }}-800 px-4 py-3 rounded relative max-w-sm">
                            <span class="block">{{ message }}</span>
                            <button class="absolute top-0 bottom-0 right-0 px-2 py-3" onclick="this.parentElement.style.display='none'" aria-label="Fechar notificação">
                                <i class="fas fa-times" aria-hidden="true"></i>
                            </button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        <!-- Main content area -->
        {% block content %}{% endblock %}
    </div>
    
    <!-- Scripts -->
    <script>
        // Auto-hide flash messages after 5 seconds
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const messages = document.querySelectorAll('.flash-message');
                messages.forEach(function(message) {
                    message.style.display = 'none';
                });
            }, 5000);
        });
    </script>
    <!-- CSRF auto-inject: adds token to all forms and AJAX requests -->
    <script>
    (function() {
        var token = (document.querySelector('meta[name="csrf-token"]') || {}).content;
        if (!token) return;
        // Forms
        document.addEventListener('submit', function(e) {
            var form = e.target;
            if (form.tagName !== 'FORM') return;
            if (!form.querySelector('input[name="_csrf_token"]')) {
                var inp = document.createElement('input');
                inp.type = 'hidden'; inp.name = '_csrf_token'; inp.value = token;
                form.appendChild(inp);
            }
        }, true);
        // fetch()
        var origFetch = window.fetch;
        window.fetch = function(url, opts) {
            opts = opts || {};
            var method = (opts.method || 'GET').toUpperCase();
            if (['GET','HEAD','OPTIONS'].indexOf(method) === -1) {
                opts.headers = opts.headers || {};
                if (typeof opts.headers.set === 'function') {
                    opts.headers.set('X-CSRFToken', token);
                } else {
                    opts.headers['X-CSRFToken'] = token;
                }
            }
            return origFetch.call(this, url, opts);
        };
        // XMLHttpRequest
        var origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method) {
            this._xhrMethod = method;
            return origOpen.apply(this, arguments);
        };
        var origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function() {
            var m = (this._xhrMethod || 'GET').toUpperCase();
            if (['GET','HEAD','OPTIONS'].indexOf(m) === -1) {
                try { this.setRequestHeader('X-CSRFToken', token); } catch(e) {}
            }
            return origSend.apply(this, arguments);
        };
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
